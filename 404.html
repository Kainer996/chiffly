<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost in ChiffTown — Page Not Found</title>
    <meta name="description" content="This page doesn't exist in ChiffTown. Head back to the map and explore our virtual town.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180x180.png">
    <meta name="theme-color" content="#0a0a1a">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #0d1b2a 0%, #0a0a1a 70%);
            z-index: 0;
        }
        .stars::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(2px 2px at 20px 30px, #c8a96e33, transparent),
                              radial-gradient(2px 2px at 40px 70px, #c8a96e22, transparent),
                              radial-gradient(1px 1px at 90px 40px, #c8a96e44, transparent),
                              radial-gradient(1px 1px at 130px 80px, #c8a96e22, transparent),
                              radial-gradient(2px 2px at 160px 30px, #c8a96e33, transparent);
            background-size: 200px 100px;
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.5; } to { opacity: 1; } }
        .container {
            position: relative;
            z-index: 1;
            padding: 2rem;
            max-width: 520px;
        }
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #c8a96e, #f0d888, #c8a96e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #c8a96e;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            color: #9aa;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(135deg, #c8a96e, #e0c17d);
            color: #0a0a1a;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(200, 169, 110, 0.3);
        }
        @media (max-width: 480px) {
            .error-code { font-size: 5rem; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Lost in the Fog</h1>
        <p>You've wandered off the map. This part of ChiffTown doesn't exist — yet. Head back to town and find your way.</p>
        <a href="/" class="btn">Back to ChiffTown</a>
        <p style="margin-top:2rem;opacity:0.6;font-size:0.9rem;">Or try one of these:</p>
        <nav aria-label="Helpful links" style="display:flex;flex-wrap:wrap;gap:0.75rem;justify-content:center;margin-top:1rem;">
            <a href="/pub.html" style="color:rgba(201,168,76,0.85);text-decoration:none;padding:0.4rem 1rem;border:1px solid rgba(201,168,76,0.3);border-radius:50px;font-size:0.9rem;">🍺 The Pub</a>
            <a href="/nightclub.html" style="color:rgba(201,168,76,0.85);text-decoration:none;padding:0.4rem 1rem;border:1px solid rgba(201,168,76,0.3);border-radius:50px;font-size:0.9rem;">🎵 Nightclub</a>
            <a href="/cinema.html" style="color:rgba(201,168,76,0.85);text-decoration:none;padding:0.4rem 1rem;border:1px solid rgba(201,168,76,0.3);border-radius:50px;font-size:0.9rem;">🎬 Cinema</a>
            <a href="/blog/" style="color:rgba(201,168,76,0.85);text-decoration:none;padding:0.4rem 1rem;border:1px solid rgba(201,168,76,0.3);border-radius:50px;font-size:0.9rem;">✍️ Blog</a>
            <a href="/about.html" style="color:rgba(201,168,76,0.85);text-decoration:none;padding:0.4rem 1rem;border:1px solid rgba(201,168,76,0.3);border-radius:50px;font-size:0.9rem;">ℹ️ About</a>
        </nav>
    </div>
</body>
</html>
